[package]
name = "omacam-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = "0.8.8"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
crossbeam-channel = "0.5.15"
getrandom = "0.4.3"
futures-util = "0.3.31"
mdns-sd = { version = "0.21.3", default-features = false }
omacam-core = { path = "../omacam-core" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.10", features = ["zeroize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
str0m = { version = "0.23.1", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true
