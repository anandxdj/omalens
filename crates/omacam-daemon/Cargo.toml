[package]
name = "omacam-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
omacam-core = { path = "../omacam-core" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14.10", features = ["zeroize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring"] }

[lints]
workspace = true
